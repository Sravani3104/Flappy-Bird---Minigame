<!DOCTYPE html>
<html>
    <head>
        <title>
            Flappy Bird Clone - Trees & Clouds
        </title>
        <style>
            canvas {
                background: #87CEEB; /* sky blue background */
                display: block;
                margin: 20px auto;
                border: 10px solid #228B22; /* green border to match trees */
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
            }
            header {
                text-align: center;
                font-family: Arial, sans-serif;
                color: #333;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Flappy Bird Style Mini Game - "Cloudy Trees"</h1>
            <p>Press SPACE to flap and avoid the trees!</p>
        </header>
        <canvas id="game" width="1080" height="720"></canvas>
        <script src="game.js"></script>
    </body>
</html>
